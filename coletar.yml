name: Coletar noticias

on:
  schedule:
    - cron: "17 * * * *"     # a cada hora, no minuto 17 (UTC). O GitHub pode atrasar alguns minutos.
  workflow_dispatch:          # permite rodar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collector.py
      - name: Gravar no repositorio
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data recentes.md recentes.json status.json
          if git diff --cached --quiet; then echo "sem mudancas"; exit 0; fi
          git commit -m "coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push
