# Regras de filtro. O texto (título + resumo) é comparado sem acentos e em minúsculas.
# Cada termo casa por palavra inteira; use "*" no fim para prefixo (ex.: "semicondutor*").
# Um item entra se a soma dos pesos dos temas encontrados + bônus da fonte >= pontuacao_minima.
# Cada tema conta uma vez por item, mesmo com vários termos encontrados.

pontuacao_minima: 2

descartar:   # se qualquer termo aparecer, o item é descartado
  - mega-sena
  - lotofacil
  - quina
  - loteria*
  - +milionaria
  - gas do povo
  - bolsa familia
  - patrocinado
  - publieditorial
  - conteudo de marca
  - sponsored
  - cupom de desconto
  - horoscopo
  - medicare
  - social security
  - casa clear
  - copa btg trader
  - dear quentin
  - moneyist

